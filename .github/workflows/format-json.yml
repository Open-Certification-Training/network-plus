name: Fix JSON formatting

on:
  pull_request:
    paths-ignore:
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: format-json-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    # Fork pull requests use the read-only formatting check in quality.yml.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/quality/package-lock.json
      - run: npm --prefix .github/quality ci --ignore-scripts
      - run: npm --prefix .github/quality run format:json
      - name: Commit and push formatting changes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -- '*.json' ':(top,exclude).github/**'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            -c core.hooksPath=/dev/null \
            commit -m "style: format JSON"
          # A normal push fails safely if the contributor has pushed newer work.
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run quality checks on the formatting commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        # Explicit dispatch ensures the bot commit gets its own checks.
        run: gh workflow run quality.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
